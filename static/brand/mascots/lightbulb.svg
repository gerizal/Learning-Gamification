<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Yellow lightbulb mascot</title>
  <desc id="desc">A cheerful yellow lightbulb character with large eyes, a small smile, and four blue idea rays.</desc>

  <defs>
    <radialGradient id="background" cx="50%" cy="44%" r="72%">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="0.62" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f2eee8"/>
    </radialGradient>

    <radialGradient id="body" cx="47%" cy="33%" r="76%">
      <stop offset="0" stop-color="#ffd92a"/>
      <stop offset="0.54" stop-color="#ffcc09"/>
      <stop offset="1" stop-color="#ffc000"/>
    </radialGradient>

    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0878ff"/>
      <stop offset="1" stop-color="#005bea"/>
    </linearGradient>

    <radialGradient id="eye" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f5"/>
    </radialGradient>

    <radialGradient id="pupil" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#333333"/>
      <stop offset="1" stop-color="#242424"/>
    </radialGradient>

    <filter id="figureShadow" x="-25%" y="-20%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dx="0" dy="16" result="offsetBlur"/>
      <feFlood flood-color="#b28b20" flood-opacity="0.12" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="rayShadow" x="-60%" y="-50%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
      <feFlood flood-color="#0057d9" flood-opacity="0.13" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="eyeShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="7" result="offsetBlur"/>
      <feFlood flood-color="#a67b00" flood-opacity="0.08" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- NO BACKDROP RECT. It used to paint a full-bleed cream gradient (#fffefa → #f2eee8) across all
       1200×1200, which is invisible on a white page and a CREAM RECTANGLE everywhere else. Measured
       2026-08-14: `.land-cast` on the landing hero uses the primary amber token, so Ed
       rendered as a pale square sitting on the brand panel, in the first thing a visitor sees.

       A mascot is a character, not a tile. The backdrop belongs to whatever surface it stands on,
       and every surface here already has one. Removing the rect makes the artwork transparent; the
       geometry below is untouched. -->
  <!-- (the #background gradient is retained in <defs> unused, so restoring this is one line) -->

  <!-- Idea rays. Every element remains editable vector geometry. -->
  <g fill="url(#ray)" filter="url(#rayShadow)">
    <rect x="306" y="169" width="53" height="124" rx="26.5" transform="rotate(-40 332.5 231)"/>
    <rect x="487" y="102" width="53" height="126" rx="26.5" transform="rotate(-12 513.5 165)"/>
    <rect x="675" y="104" width="53" height="126" rx="26.5" transform="rotate(14 701.5 167)"/>
    <rect x="841" y="173" width="53" height="124" rx="26.5" transform="rotate(40 867.5 235)"/>
  </g>

  <!-- Unified mascot silhouette: bulb, arms, stem, and feet. -->
  <path
    d="M600 262
       C414 262 266 402 266 580
       C266 648 288 708 328 764
       C291 797 268 834 270 871
       C272 908 296 928 328 921
       C356 915 375 896 390 875
       C419 919 441 956 437 1001
       C432 1057 455 1094 500 1097
       C548 1100 574 1077 575 1023
       C592 1022 610 1022 627 1024
       C628 1077 648 1094 697 1097
       C747 1100 771 1075 767 1027
       C763 981 782 927 811 877
       C828 900 847 916 873 921
       C905 927 929 907 930 871
       C931 833 908 797 874 765
       C915 708 936 647 936 580
       C936 402 786 262 600 262 Z"
    fill="url(#body)"
    filter="url(#figureShadow)"/>

  <!-- Eyes. -->
  <g filter="url(#eyeShadow)">
    <circle cx="499" cy="578" r="102" fill="url(#eye)"/>
    <circle cx="705" cy="578" r="102" fill="url(#eye)"/>
  </g>

  <!-- Pupils and their characteristic crescent highlights. -->
  <g>
    <circle cx="534" cy="558" r="60" fill="url(#pupil)"/>
    <circle cx="497" cy="512" r="24" fill="#fff"/>

    <circle cx="738" cy="557" r="60" fill="url(#pupil)"/>
    <circle cx="700" cy="512" r="24" fill="#fff"/>
  </g>

  <!-- Friendly smile. -->
  <path d="M555 707 C579 733 620 735 647 707"
        fill="none" stroke="#2a2a2a" stroke-width="19"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
